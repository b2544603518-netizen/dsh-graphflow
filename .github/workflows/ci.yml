name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + tests (100% coverage) + build
      - run: pnpm check

      # Fail if the committed lib/ is out of sync with src/ after a clean build.
      - name: Verify lib/ is up to date
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ is stale — run 'pnpm build' and commit the result."
            exit 1
          fi
